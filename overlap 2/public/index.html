<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overlap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Overlap">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8fd0f7">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mut:#6b7785;--card:#f3f8fc;--line:#e2ebf2;--blue:#8fd0f7;--blue2:#d9eefc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#fff;--mut:#9aa7b4;--card:#151a1f;--line:#252d35;--blue2:#16384d}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#fff;--mut:#9aa7b4;--card:#151a1f;--line:#252d35;--blue2:#16384d}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.btn{background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}
.btn.blue{background:var(--blue);color:#0a0a0a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
input:focus,textarea:focus{outline:2px solid var(--blue)}
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate{max-width:440px;width:100%}
.gate h1{font-size:40px;letter-spacing:-1.5px;margin:0 0 6px}
.gate p{color:var(--mut);margin:0 0 24px}
.who{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:18px;padding:16px;margin-bottom:10px;font-size:18px;font-weight:600}
.who.sel{border-color:var(--fg)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.dot.l{width:30px;height:30px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--fg)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut);font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;letter-spacing:-.5px;margin:0}
.me{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.banner{margin:14px 20px 0;background:var(--blue2);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner span{flex:1;min-width:180px;font-size:14px}
.yn{display:flex;gap:8px}
.yn button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;background:var(--card);border:1px solid var(--line)}
.yn .y.on,.yn .y:hover{background:var(--blue);color:#0a0a0a;border-color:var(--blue)}
.yn .n.on,.yn .n:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;padding:20px;max-width:1150px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav h2{margin:0;font-size:24px;letter-spacing:-.8px}
.nav button{width:38px;height:38px;border-radius:50%;background:var(--card);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:11px;color:var(--mut);font-weight:600;padding:4px 0}
.day{aspect-ratio:1/1;min-height:46px;background:var(--card);border-radius:14px;padding:6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:13px;font-weight:600;border:2px solid transparent}
.day.out{opacity:.35}
.day.today{background:var(--blue2)}
.day.sel{border-color:var(--fg)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.panel{background:var(--card);border-radius:24px;padding:20px;align-self:start}
.panel h3{margin:0 0 2px;font-size:22px;letter-spacing:-.6px}
.panel .sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.ev{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:12px;border-left:6px solid var(--blue)}
.ev h4{margin:0 0 4px;font-size:16px}
.meta{font-size:13px;color:var(--mut);line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:5px}
.cm{font-size:13px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.cm b{white-space:nowrap}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1}
.form{display:grid;gap:8px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.with{display:flex;gap:6px;flex-wrap:wrap}
.with label{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--bg);padding:6px 10px;border-radius:999px}
.with input{width:auto}
.sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head>
<body>
<div id="gate"></div>
<div id="app" hidden>
  <header><h1>Overlap</h1><div class="me" id="me"></div></header>
  <div id="stat"></div>
  <div id="banner"></div>
  <main>
    <section><div class="nav"><button id="prev" aria-label="Previous month">‹</button><h2 id="mt"></h2><button id="next" aria-label="Next month">›</button></div><div class="grid" id="grid"></div></section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<script>
const NAMES=["Chloe","Charles","Yvonne"];
const SW=["#8fd0f7","#4f9cf0","#1d5fa8","#0a0a0a","#5a6b7a","#b9c7d3","#38bdf8","#6366f1"];
let people={Chloe:{color:SW[0]},Charles:{color:SW[3]},Yvonne:{color:SW[1]}};
let events=[],days={},me=null,pick=null,pickColor=null,db=null,draft={w:[]},lastSig="";
let view=new Date();view.setDate(1);let sel=iso(new Date());
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function $(id){return document.getElementById(id)}
function el(t,p,...k){const e=document.createElement(t);if(p)for(const a in p){if(a==="class")e.className=p[a];else if(a.startsWith("on"))e[a]=p[a];else if(a==="style")e.style.cssText=p[a];else if(p[a]!==false&&p[a]!=null)e.setAttribute(a,p[a])}k.flat().forEach(c=>{if(c!=null)e.append(c.nodeType?c:document.createTextNode(c))});return e}
function col(n){return (people[n]&&people[n].color)||"#8fd0f7"}
function dot(n,l){return el("span",{class:"dot"+(l?" l":""),style:"background:"+col(n)})}
function fmt(t){if(!t)return"";const[h,m]=t.split(":").map(Number);return((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")}

/* ---------- storage ---------- */
function stat(m){const s=$("stat");s.replaceChildren();if(m)s.append(el("div",{class:"banner",style:"background:var(--card);color:var(--mut);font-size:12px;padding:6px 14px;margin-top:10px"},m))}
async function api(method,body){const r=await fetch("/api",{method,headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
let busy=0;
async function pull(){if(busy)return;try{const s=await api("GET");if(busy)return;stat("");const sig=JSON.stringify([s.events,s.people,s.days]);if(sig===lastSig)return;events=s.events;Object.keys(s.people).forEach(n=>people[n]=s.people[n]);days=s.days;const a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.closest("#panel")&&(a.type==="checkbox"||a.value))return;lastSig=sig;render()}catch(e){stat("Can't reach the calendar right now. Retrying...")}}
async function push(kind,id,data){busy++;try{await api("POST",{kind,id,data});stat("")}catch(e){stat("Couldn't save that. Check your connection and try again.")}finally{busy--}}
async function start(){
  try{me=localStorage.getItem("calMe")}catch(e){}
  if(me&&NAMES.includes(me))enter();else gate();
  await pull();setInterval(pull,4000);
}
async function saveEv(ev){const i=events.findIndex(e=>e.id===ev.id);if(i>=0)events[i]=ev;else events.push(ev);render();const{id,...r}=ev;await push("event",id,r)}
async function savePerson(n,c){people[n]={color:c};await push("person",n,{color:c})}
async function saveDay(k,list){days[k]={comments:list};render();await push("day",k,{comments:list})}

/* ---------- gate ---------- */
function gate(){
  const g=$("gate");g.hidden=false;$("app").hidden=true;g.replaceChildren();
  const box=el("div",{class:"gate"},el("h1",null,"Who are you?"),el("p",null,"Pick your name and your color. Everything you add shows up in it."));
  NAMES.forEach(n=>box.append(el("button",{class:"who"+(pick===n?" sel":""),onclick:()=>{pick=n;pickColor=col(n);gate()}},dot(n,true),n)));
  if(pick){box.append(el("div",{class:"lbl",style:"margin-top:18px"},"Your color"));
    const sw=el("div",{class:"sw"});
    SW.forEach(c=>sw.append(el("button",{class:c===pickColor?"on":"",style:"background:"+c,"aria-label":c,onclick:()=>{pickColor=c;gate()}})));
    box.append(sw,el("button",{class:"btn",style:"width:100%;padding:14px",onclick:()=>{savePerson(pick,pickColor);me=pick;try{localStorage.setItem("calMe",me)}catch(e){}enter()}},"Open calendar"))}
  g.append(box);
}
function enter(){$("gate").hidden=true;$("app").hidden=false;render()}

/* ---------- render ---------- */
function render(){
  if(!me)return;
  $("me").replaceChildren(dot(me),"Hi, "+me+" ",el("button",{class:"btn ghost",style:"padding:6px 12px;font-size:12px",onclick:()=>{pick=me;pickColor=col(me);gate()}},"Switch"));
  // top banner: events waiting on my yes/no
  const pend=events.filter(e=>e.owner!==me&&!(e.resp&&e.resp[me])&&e.date>=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date))[0];
  $("banner").replaceChildren();
  if(pend)$("banner").append(el("div",{class:"banner"},dot(pend.owner),el("span",null,pend.owner+" asks: "+pend.title+" · "+pend.date+(pend.time?" at "+fmt(pend.time):"")),ynBtns(pend)));
  $("mt").textContent=view.toLocaleString("default",{month:"long",year:"numeric"});
  const g=$("grid");g.replaceChildren();
  ["S","M","T","W","T","F","S"].forEach(d=>g.append(el("div",{class:"dow"},d)));
  const start=new Date(view);start.setDate(1-view.getDay());
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    const dots=el("div",{class:"dots"});events.filter(e=>e.date===k).slice(0,6).forEach(e=>dots.append(el("i",{style:"background:"+col(e.owner)})));
    g.append(el("button",{class:"day"+(d.getMonth()!==view.getMonth()?" out":"")+(k===iso(new Date())?" today":"")+(k===sel?" sel":""),onclick:()=>{sel=k;render()}},d.getDate(),dots));}
  panel();
}
function ynBtns(ev){const r=(ev.resp||{})[me];
  return el("div",{class:"yn"},
    el("button",{class:"y"+(r==="yes"?" on":""),onclick:()=>respond(ev,"yes")},"Yes"),
    el("button",{class:"n"+(r==="no"?" on":""),onclick:()=>respond(ev,"no")},"No"))}
function respond(ev,v){const r={...(ev.resp||{})};if(r[me]===v)delete r[me];else r[me]=v;saveEv({...ev,resp:r})}

function panel(){
  const p=$("panel");const d=new Date(sel+"T00:00");p.replaceChildren();
  const list=events.filter(e=>e.date===sel).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  p.append(el("h3",null,d.toLocaleDateString("default",{weekday:"long",month:"long",day:"numeric"})),
    el("div",{class:"sub"},list.length?list.length+" planned · everyone can see this":"Nothing planned yet"));
  list.forEach(ev=>p.append(evCard(ev)));
  p.append(addForm());
  // day chat
  const cs=(days[sel]&&days[sel].comments)||[];
  const sec=el("div",{class:"sec"},el("div",{class:"lbl"},"Day chat"));
  cs.forEach(c=>sec.append(cm(c)));
  sec.append(commentBox("Say something about this day…",t=>saveDay(sel,[...cs,{who:me,text:t,ts:Date.now()}])));
  p.append(sec);
}
function cm(c){return el("div",{class:"cm"},dot(c.who),el("div",null,el("b",null,c.who+" "),c.text))}
function commentBox(ph,fn){const i=el("input",{placeholder:ph});
  const go=()=>{const t=i.value.trim();if(t)fn(t)};i.onkeydown=e=>{if(e.key==="Enter")go()};
  return el("div",{class:"row"},i,el("button",{class:"btn blue",onclick:go},"Send"))}
function evCard(ev){
  const chips=el("div",{class:"chips"});
  NAMES.forEach(n=>{const r=n===ev.owner?"host":(ev.resp||{})[n];chips.append(el("span",{class:"chip"},dot(n),n+": "+(r||"waiting")))});
  const card=el("div",{class:"ev",style:"border-left-color:"+col(ev.owner)},
    el("h4",null,ev.title),
    el("div",{class:"meta"},[ev.time?"🕐 "+fmt(ev.time):"",ev.duration?"⏱ "+ev.duration:"",ev.where?"📍 "+ev.where:"",(ev.with&&ev.with.length)?"👥 with "+ev.with.join(", "):"","added by "+ev.owner].filter(Boolean).map(t=>el("div",null,t))),
    chips);
  if(ev.owner!==me)card.append(ynBtns(ev));
  else card.append(el("button",{class:"btn ghost",style:"padding:6px 12px;font-size:12px",onclick:()=>{api("DELETE",{kind:"event",id:ev.id}).catch(()=>stat("Couldn't delete that."));events=events.filter(e=>e.id!==ev.id);render()}},"Delete"));
  (ev.comments||[]).forEach(c=>card.append(cm(c)));
  card.append(commentBox("Comment… what time?",t=>saveEv({...ev,comments:[...(ev.comments||[]),{who:me,text:t,ts:Date.now()}]})));
  return card;
}
function addForm(){
  const f=el("form",{class:"form",onsubmit:e=>e.preventDefault()});
  const t=el("input",{placeholder:"What's the plan?",required:true}),tm=el("input",{type:"time"}),dur=el("input",{placeholder:"Duration (e.g. 2 hrs)"}),wh=el("input",{placeholder:"Where"});
  const w=el("div",{class:"with"});
  const addOpt=(n,on)=>{const ex=[...w.querySelectorAll("input")].find(i=>i.value.toLowerCase()===n.toLowerCase());if(ex){if(on)ex.checked=true;return}w.append(el("label",null,el("input",{type:"checkbox",value:n,checked:on?"":false}),dot(n),n))};
  NAMES.filter(n=>n!==me).forEach(n=>addOpt(n));
  [...new Set(events.flatMap(e=>e.with||[]))].filter(n=>!NAMES.includes(n)&&n!==me).forEach(n=>addOpt(n));
  const gi=el("input",{placeholder:"Add someone else (name)"});
  const addG=()=>{const n=gi.value.trim();if(n){addOpt(n,true);gi.value="";draft.gi="";w.onchange()}};
  t.value=draft.t||"";tm.value=draft.tm||"";dur.value=draft.dur||"";wh.value=draft.wh||"";gi.value=draft.gi||"";
  (draft.w||[]).forEach(n=>addOpt(n,true));
  [[t,"t"],[tm,"tm"],[dur,"dur"],[wh,"wh"],[gi,"gi"]].forEach(([i,k])=>i.oninput=()=>{draft[k]=i.value});
  w.onchange=()=>{draft.w=[...w.querySelectorAll("input:checked")].map(i=>i.value)};
  gi.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addG()}};
  f.append(el("div",{class:"lbl"},"Add to calendar"),t,el("div",{class:"two"},tm,dur),wh,el("div",{class:"lbl"},"With who"),w,el("div",{class:"row"},gi,el("button",{class:"btn ghost",type:"button",onclick:addG},"Add")),
    el("button",{class:"btn",onclick:()=>{if(!t.value.trim())return;
      const ev0={id:"e"+Date.now().toString(36),title:t.value.trim(),date:sel,time:tm.value,duration:dur.value.trim(),where:wh.value.trim(),
        with:[...w.querySelectorAll("input:checked")].map(i=>i.value),owner:me,resp:{},comments:[]};draft={w:[]};saveEv(ev0)}},"Add & ask everyone"));
  return f;
}
$("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
$("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
start();
</script></body></html>
